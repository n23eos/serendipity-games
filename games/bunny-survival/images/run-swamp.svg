    <g stroke="#4a6b2c" stroke-width="11" stroke-linecap="round">
      <path d="M-8 6l-52 18M6 6l50 20M-2 8l-16 26M2 8l20 24"/>
    </g>
    <!-- стебель -->
    <rect x="-15" y="-96" width="30" height="106" rx="10" fill="#5f8f3a"/>
    <!-- листья -->
    <path d="M-15 -34c-40-16-64-4-70 10 22 14 52 12 70-2z" fill="#4a6b2c"/>
    <path d="M15 -50c42-14 68 0 74 14-24 12-54 8-74-6z" fill="#5c8434"/>
    <!-- пасть -->
    <g transform="translate(0 -108)">
      <path d="M-46 -6c0-26 20-42 46-42s46 16 46 42c-18 12-30 16-46 16s-30-4-46-16z" fill="#b03a5a"/>
      <path d="M-46 4c0 24 20 38 46 38s46-14 46-38c-18-12-30-16-46-16s-30 4-46 16z" fill="#8f2f4f"/>
      <g fill="#f2e8d0">
        <path d="M-34 -8l8 14-14 2z"/><path d="M-12 -12l8 16-16 2z"/>
        <path d="M10 -12l8 16-16 2z"/><path d="M32 -8l6 14-14 2z"/>
        <path d="M-34 8l8-14-14-2z"/><path d="M-12 12l8-16-16-2z"/>
        <path d="M10 12l8-16-16-2z"/><path d="M32 8l6-14-14-2z"/>
      </g>
    </g>
    <!-- глаза на стебле -->
    <circle cx="-11" cy="-72" r="5" fill="#101010"/>
    <circle cx="11" cy="-72" r="5" fill="#101010"/>
  </g>
