<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="msky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2450"/>
      <stop offset="0.55" stop-color="#6a5da8"/>
      <stop offset="1" stop-color="#b3a9e0"/>
    </linearGradient>
    <linearGradient id="mfloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc8ee"/>
      <stop offset="1" stop-color="#8a80bc"/>
    </linearGradient>
    <linearGradient id="mglass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0ecff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9d92d8" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="mgate" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8de8ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8de8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mtwin" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9a8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6a4a90" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#msky)"/>

  <!-- парящие осколки в небе -->
  <g fill="url(#mglass)" stroke="#e8e2ff" stroke-width="2">
    <path d="M74 66l34 -22 12 44 -30 20z"/>
    <path d="M556 44l40 16 -18 42 -34 -18z"/>
    <path d="M300 30l26 -14 6 34 -24 12z"/>
    <path d="M180 118l22 -12 6 26 -20 10z"/>
  </g>

  <!-- пол: стеклянная равнина с трещинами -->
  <path d="M0 214h640v146H0z" fill="url(#mfloor)"/>
  <g stroke="#7d72ad" stroke-width="3" opacity="0.75" fill="none">
    <path d="M0 246l120 18 90 -26 130 32 100 -22 200 26"/>
    <path d="M60 360l40 -66 -22 -48M340 360l-30 -74 44 -40M520 360l26 -70 -34 -46"/>
  </g>

  <!-- ртутная лужа -->
  <ellipse cx="150" cy="300" rx="104" ry="30" fill="#7488a0"/>
  <ellipse cx="150" cy="295" rx="80" ry="20" fill="#93a8bd"/>
  <ellipse cx="126" cy="290" rx="30" ry="8" fill="#c7d6e2"/>

  <!-- зеркальные врата: пара -->
  <g>
    <ellipse cx="392" cy="296" rx="54" ry="18" fill="url(#mgate)"/>
    <ellipse cx="392" cy="296" rx="40" ry="13" fill="none" stroke="#8de8ff" stroke-width="5"/>
    <rect x="352" y="238" width="9" height="60" fill="#a79ede"/>
    <rect x="423" y="238" width="9" height="60" fill="#a79ede"/>
  </g>
  <g opacity="0.8">
    <ellipse cx="576" cy="252" rx="40" ry="13" fill="url(#mgate)"/>
    <ellipse cx="576" cy="252" rx="29" ry="10" fill="none" stroke="#8de8ff" stroke-width="4"/>
    <rect x="547" y="212" width="7" height="42" fill="#a79ede"/>
    <rect x="599" y="212" width="7" height="42" fill="#a79ede"/>
  </g>

  <!-- стоящие осколки-«деревья» -->
  <g fill="url(#mglass)" stroke="#c3bbe8" stroke-width="3">
    <path d="M40 236l22 -78 20 12 -8 74z"/>
    <path d="M254 226l16 -54 18 10 -6 50z"/>
  </g>

  <!-- заяц и его отражение: эхо идёт по его следу -->
  <g>
    <!-- след -->
    <g stroke="#8de8ff" stroke-width="5" stroke-dasharray="12 9" opacity="0.9" fill="none">
      <path d="M244 296c-24 -30 4 -56 44 -54 32 2 56 -8 72 -28"/>
    </g>
    <!-- заяц -->
    <g transform="translate(360 232)">
      <rect x="-16" y="-8" width="32" height="34" fill="#f6f2ea"/>
      <rect x="-14" y="-46" width="11" height="34" rx="5" fill="#f6f2ea"/>
      <rect x="3" y="-46" width="11" height="34" rx="5" fill="#f6f2ea"/>
      <rect x="-18" y="-20" width="36" height="22" rx="8" fill="#f6f2ea"/>
      <rect x="-11" y="-14" width="7" height="8" fill="#2b2338"/>
      <rect x="4" y="-14" width="7" height="8" fill="#2b2338"/>
      <rect x="-4" y="-6" width="8" height="5" fill="#e79bb0"/>
      <rect x="14" y="4" width="10" height="26" rx="4" fill="#ff9800"/>
    </g>
    <!-- эхо -->
    <g transform="translate(238 302)" opacity="0.85">
      <rect x="-16" y="-8" width="32" height="34" fill="#9a8fd8"/>
      <rect x="-14" y="-46" width="11" height="34" rx="5" fill="#9a8fd8"/>
      <rect x="3" y="-46" width="11" height="34" rx="5" fill="#9a8fd8"/>
      <rect x="-18" y="-20" width="36" height="22" rx="8" fill="#9a8fd8"/>
      <rect x="-11" y="-14" width="7" height="8" fill="#fff2a8"/>
      <rect x="4" y="-14" width="7" height="8" fill="#fff2a8"/>
    </g>
  </g>

  <!-- зазеркальный двойник -->
  <g transform="translate(500 214)">
    <circle cx="0" cy="-70" r="118" fill="url(#mtwin)"/>
    <!-- уши -->
    <rect x="-38" y="-208" width="26" height="84" rx="11" fill="#5b5390"/>
    <rect x="12" y="-208" width="26" height="84" rx="11" fill="#5b5390"/>
    <!-- голова -->
    <rect x="-46" y="-136" width="92" height="66" rx="10" fill="#5b5390"/>
    <rect x="-30" y="-116" width="20" height="22" fill="#fff2a8"/>
    <rect x="10" y="-116" width="20" height="22" fill="#fff2a8"/>
    <rect x="-9" y="-88" width="18" height="10" fill="#e8e2ff"/>
    <!-- корпус -->
    <rect x="-52" y="-70" width="104" height="76" fill="#6a4a90"/>
    <!-- трещины -->
    <g stroke="#e8e2ff" stroke-width="5" fill="none">
      <path d="M-42 -58l22 20 -10 24 24 14"/>
      <path d="M34 -60l-10 30 16 8 -6 22"/>
    </g>
    <!-- лапы -->
    <rect x="-76" y="-58" width="24" height="60" rx="8" fill="#5b5390"/>
    <rect x="52" y="-58" width="24" height="60" rx="8" fill="#5b5390"/>
    <!-- осколки у ног -->
    <g fill="#e8e2ff" opacity="0.85">
      <path d="M-70 12l16 -18 8 20z"/>
      <path d="M62 16l18 -14 4 18z"/>
    </g>
  </g>
</svg>
