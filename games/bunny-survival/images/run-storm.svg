<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="ssky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141d2b"/>
      <stop offset="0.55" stop-color="#2f4258"/>
      <stop offset="1" stop-color="#5b7590"/>
    </linearGradient>
    <linearGradient id="ssea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25506e"/>
      <stop offset="1" stop-color="#12293c"/>
    </linearGradient>
    <linearGradient id="sisle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9472"/>
      <stop offset="1" stop-color="#3c5742"/>
    </linearGradient>
    <radialGradient id="sflash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8f6ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#81d4fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sbird" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b3e5fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#ssky)"/>

  <!-- грозовые тучи -->
  <g fill="#1b2636">
    <ellipse cx="120" cy="52" rx="120" ry="40"/>
    <ellipse cx="300" cy="34" rx="140" ry="36"/>
    <ellipse cx="530" cy="56" rx="130" ry="42"/>
  </g>
  <g fill="#2b3a4f">
    <ellipse cx="200" cy="72" rx="90" ry="26"/>
    <ellipse cx="470" cy="78" rx="100" ry="26"/>
  </g>

  <!-- дальняя молния -->
  <g stroke="#cfeaff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M120 84l-16 40h22l-24 46"/>
  </g>
  <circle cx="112" cy="120" r="52" fill="url(#sflash)"/>

  <!-- море -->
  <path d="M0 196h640v164H0z" fill="url(#ssea)"/>
  <g stroke="#4f89ad" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M24 226h58M120 244h44M470 222h60M556 250h52M40 300h50M540 306h60"/>
  </g>

  <!-- дальний островок -->
  <path d="M446 196c30-14 84-14 118 0z" fill="#3c5742"/>

  <!-- главный остров -->
  <path d="M60 226c90-40 300-44 420-2 -60 44-150 66-236 66S110 264 60 226z" fill="url(#sisle)"/>
  <path d="M96 232c86-30 268-32 356 0 -46 12-116 20-186 20s-134-8-170-20z" fill="#9aa3a8" opacity="0.55"/>

  <!-- пальмы, гнущиеся под ветром -->
  <g>
    <g stroke="#5b4a38" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M150 288c-6-34 4-58 22-74"/>
      <path d="M372 300c8-30 2-56-14-72"/>
    </g>
    <g fill="#3f6b4a">
      <path d="M172 214l-52 6 48 12z"/>
      <path d="M172 214l44-16-30 30z"/>
      <path d="M172 214l16 40-32-26z"/>
      <path d="M358 228l-46-14 44 30z"/>
      <path d="M358 228l48 4-42 20z"/>
      <path d="M358 228l-6 40 26-30z"/>
    </g>
  </g>

  <!-- громоотвод: заряженная мачта -->
  <g>
    <ellipse cx="256" cy="300" rx="80" ry="20" fill="#fff59d" opacity="0.2"/>
    <ellipse cx="256" cy="300" rx="80" ry="20" fill="none" stroke="#fff59d" stroke-width="4" opacity="0.75"/>
    <rect x="238" y="286" width="36" height="14" fill="#4a545e"/>
    <rect x="250" y="176" width="12" height="112" fill="#7c8a95"/>
    <rect x="243" y="160" width="26" height="22" fill="#fff59d"/>
  </g>
  <!-- разряд в мачту -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M256 160l-18-46h26l-22-54"/>
  </g>
  <circle cx="256" cy="150" r="46" fill="url(#sflash)"/>

  <!-- косой ливень -->
  <g stroke="#bfe4ff" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <path d="M30 120l-16 34M96 168l-16 34M180 96l-16 34M214 200l-16 34M330 130l-16 34M398 90l-16 34M448 180l-16 34M520 128l-16 34M596 168l-16 34M604 76l-16 34"/>
  </g>

  <!-- громовая птица -->
  <g transform="translate(452 150)">
    <circle cx="0" cy="0" r="110" fill="url(#sbird)"/>
    <!-- крылья -->
    <path d="M-24 -14l-124 -34 22 34 -14 26 116 10z" fill="#46606f"/>
    <path d="M24 -14l124 -34 -22 34 14 26 -116 10z" fill="#46606f"/>
    <g fill="#fff59d">
      <path d="M-24 22l-114 -6 6 12 108 6z"/>
      <path d="M24 22l114 -6 -6 12 -108 6z"/>
    </g>
    <!-- тело -->
    <path d="M-30 -40h60v82h-60z" fill="#3c4c78"/>
    <rect x="-20" y="0" width="40" height="34" fill="#fff59d"/>
    <!-- хвост -->
    <path d="M-24 42h48l-10 34h-28z" fill="#46606f"/>
    <!-- голова -->
    <rect x="-24" y="-78" width="48" height="42" fill="#46606f"/>
    <path d="M24 -62h30l-30 20z" fill="#ffb300"/>
    <rect x="-8" y="-70" width="14" height="12" fill="#fff59d"/>
    <!-- гребень -->
    <g fill="#46606f">
      <rect x="-26" y="-96" width="9" height="22" transform="rotate(-14 -22 -85)"/>
      <rect x="-12" y="-102" width="9" height="28" transform="rotate(-8 -8 -88)"/>
      <rect x="2" y="-98" width="9" height="24" transform="rotate(-2 6 -86)"/>
    </g>
    <!-- лапы -->
    <g fill="#ffb300">
      <rect x="-18" y="42" width="10" height="22"/>
      <rect x="8" y="42" width="10" height="22"/>
    </g>
  </g>
</svg>
