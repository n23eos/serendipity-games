  <script>
    window.installGameInputGuards = function installGameInputGuards() {
      if (window.__gameInputGuardsInstalled) return;
      window.__gameInputGuardsInstalled = true;

      const prevent = event => event.preventDefault();
      const lockViewport = () => {
        const root = document.documentElement;
        const body = document.body;
        root.style.overflow = 'hidden';
        root.style.position = 'fixed';
        root.style.inset = '0';
        root.style.width = '100%';
        root.style.height = '100%';
        if (body) {
          body.style.overflow = 'hidden';
          body.style.position = 'fixed';
          body.style.inset = '0';
          body.style.width = '100%';
          body.style.height = '100%';
        }
        window.scrollTo(0, 0);
      };
      const isInteractiveControl = event => event.target?.closest?.(
        'button, select, option, input, textarea, [role="button"]'
      );
      // Ползунки громкости (пауза, настройки деревни) обязаны получать
      // touchmove: без него их нельзя перетащить пальцем — работает только тап
      // по дорожке. Прокрутку страницы это не открывает: html/body
      // зафиксированы, а на них стоит touch-action:none.
      const preventUnlessSliderDrag = event => {
        if (event.target?.closest?.('input[type="range"]')) return;
        event.preventDefault();
      };
      const preventGameFieldDefault = event => {
        if (isInteractiveControl(event)) return;
        event.preventDefault();
      };

      document.addEventListener('contextmenu', prevent, { capture: true });
      document.addEventListener('selectstart', prevent, { capture: true });
      document.addEventListener('dragstart', prevent, { capture: true });
      document.addEventListener('gesturestart', prevent, { capture: true });
      document.addEventListener('auxclick', prevent, { capture: true });
      document.addEventListener('mousedown', preventGameFieldDefault, { capture: true });
      document.addEventListener('pointerdown', preventGameFieldDefault, { capture: true });
      document.addEventListener('touchstart', preventGameFieldDefault, { capture: true, passive: false });
      document.addEventListener('touchmove', preventUnlessSliderDrag, { capture: true, passive: false });
      document.addEventListener('wheel', preventUnlessSliderDrag, { capture: true, passive: false });
      window.addEventListener('scroll', lockViewport, { passive: true });
      window.addEventListener('resize', lockViewport, { passive: true });
      window.addEventListener('orientationchange', lockViewport, { passive: true });
      window.addEventListener('pageshow', lockViewport, { passive: true });
      window.visualViewport?.addEventListener?.('resize', lockViewport, { passive: true });
      if (document.body) {
        lockViewport();
      } else {
        document.addEventListener('DOMContentLoaded', lockViewport, { once: true });
      }
    };
    window.installGameInputGuards();
  </script>

    /* Экран загрузки. Разметка и стили лежат прямо здесь, без единой внешней

       а не по таймеру. */
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;

    #boot-splash.is-done {

    #boot-splash__art {

      height: clamp(142px, 31vh, 224px);

    #boot-splash.has-run-art::after {

    #boot-splash.has-run-art #boot-splash__art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;

      filter: none;
      animation: bootBackdrop 12s ease-out both;
    }
    #boot-splash__title {
      position: relative;
      z-index: 2;

      background: rgba(0, 0, 0, 0.42);
      border: 2px solid rgba(255, 255, 255, 0.28);

    #boot-splash__fill {
      display: block;
      height: 100%;
      width: 12%;
      border-radius: 999px;
      background: linear-gradient(90deg, #66BB6A, #FFD600, #FF7043);
      /* Полоса растёт сама: точного процента загрузки браузер не сообщает,

      animation: bootFill 7s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;

    @keyframes bootRun {
      0%, 100% { transform: translate3d(-7px,2px,0) rotate(-2deg) scale(1); }

    }
    @keyframes bootFill {
      0%   { width: 12%; }
      60%  { width: 74%; }
      100% { width: 92%; }
    }
    @keyframes bootBackdrop {
      from { transform: scale(1.035); }
      to   { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash__art { animation: none; }
      #boot-splash__fill { animation: bootFill 7s linear forwards; }

    .boot-splash__retry {

      color: #fff;
      font-family: var(--game-font);
      font-size: 16px;
      font-weight: 900;

<body>
  <div id="boot-splash">
    <img id="boot-splash__art" src="./images/ui/loading-bunny.webp" alt="" aria-hidden="true">
    <div id="boot-splash__title">Заяц бежит!</div>
    <div id="boot-splash__bar"><span id="boot-splash__fill"></span></div>
    <script>
      // Название на сплэше обязано совпадать с карточкой на каждом языке
      // (п. 5.1.3). Бандл ещё не загружен, поэтому язык сначала угадывается
      // здесь: ?lang= из URL → ручной выбор игрока → сохранённый язык → язык
      // браузера. Догадка промахивается на Яндексе: в адресе iframe игры
      // ?lang= платформы нет, и англоязычный игрок с русским браузером видел
      // русский титул всю загрузку (возврат модерации). Поэтому язык ещё и
      // переспрашивается у SDK — он отвечает задолго до конца загрузки бандла.
      (function localizeBootTitle() {
        var TITLES = { ru: 'Заяц бежит!', en: 'Rabbit run!' };
        var LANG_KEY = 'voxel_survivor_language';
        var MANUAL_KEY = 'voxel_survivor_language_manual';

        function readStorage(key) {
          try { return localStorage.getItem(key); } catch (_) { return null; }
        }
        function normalize(value) {
          var text = String(value || '').toLowerCase();
          if (text.indexOf('ru') === 0) return 'ru';
          if (text.indexOf('en') === 0) return 'en';
          return null;
        }

        var queryLang = null;
        try { queryLang = new URLSearchParams(location.search).get('lang'); } catch (_) {}
        queryLang = normalize(queryLang);
        var saved = readStorage(LANG_KEY);
        var manual = readStorage(MANUAL_KEY) === '1' ? normalize(saved) : null;
        var browser = normalize(navigator.language) || (navigator.language ? 'en' : 'ru');

        function applyBootLang(value) {
          var lang = normalize(value);
          if (!lang || lang === window.__bootLang) return;
          // Единственный источник языка для инлайн-скриптов до бандла:
          // applyRunLoadingArt ниже обязан решать так же, а не по-своему.
          window.__bootLang = lang;
          var el = document.getElementById('boot-splash__title');
          if (el) el.textContent = TITLES[lang];
          document.title = TITLES[lang];
          // Арт части забегов тоже локализован — перерисовать под новый язык.
          if (typeof window.__refreshBootArt === 'function') window.__refreshBootArt();
        }

        applyBootLang(queryLang || manual || normalize(saved) || browser);

        // Явный выбор игрока (?lang= или язык из настроек) платформа не правит.
        if (queryLang || manual) return;

        function useSdkLang(ysdk) {
          var env = ysdk && ysdk.environment;
          applyBootLang(env && env.i18n && env.i18n.lang);
        }
        function follow(promise) {
          if (promise && typeof promise.then === 'function') promise.then(useSdkLang, function () {});
        }
        window.addEventListener('yandex-sdk-init-started', function (event) {
          follow(event && event.detail);
        });
        follow(window.__yandexSdkInitPromise);
      })();
    </script>
    <script>
      // Выбранный в деревне уровень записывается до reload. Этот короткий
      // inline-скрипт читает его раньше основного бандла, поэтому нужный арт
      // успевает появиться уже на первом кадре загрузки мира.
      (function applyRunLoadingArt() {
        var runs = ['summer', 'winter', 'candy', 'lunar', 'desert', 'swamp',
          'volcano', 'haunted', 'factory', 'storm', 'mirror', 'clockwork'];
        var queryRun = new URLSearchParams(location.search).get('run');
        var pendingRun = null;
        try { pendingRun = localStorage.getItem('voxel_survivor_pending_run_type'); } catch (_) {}
        var run = runs.indexOf(queryRun) >= 0 ? queryRun : pendingRun;
        if (runs.indexOf(run) < 0) return;

        var localized = ['summer', 'winter', 'candy', 'lunar'].indexOf(run) >= 0;
        var splash = document.getElementById('boot-splash');
        var art = document.getElementById('boot-splash__art');
        if (!splash || !art) return;

        var fallback = art.src;
        function apply() {
          var localizedSuffix = localized && window.__bootLang === 'en' ? '-en' : '';
          art.addEventListener('error', function () {
            splash.classList.remove('has-run-art');
            art.src = fallback;
          }, { once: true });
          art.src = '/images/run-' + run + localizedSuffix + '.webp';
          splash.classList.add('has-run-art');
        }
        // Язык может уточниться ответом SDK уже после первой отрисовки.
        window.__refreshBootArt = apply;
        apply();
        // Титул НЕ трогаем: он уже совпадает с карточкой (п. 5.1.3),
        // любое «художественное» название здесь — возврат с модерации.
      })();
    </script>
  </div>

  <div id="screen-vignette"></div>

  </div>

    <span aria-hidden="true"></span>
  </div>
  <script>
    // Сторож экрана загрузки. Страхует случай, когда бандл не доехал вовсе:
    // тогда main.js не выполнится и показать ошибку будет некому, а игрок
    // останется под вечной заставкой. Локализация здесь своя и минимальная —
    // словарь живёт в бандле, которого может не быть.
    (function watchBootSplash() {
      var LIMIT_MS = 25000;
      setTimeout(function () {
        var splash = document.getElementById('boot-splash');
        if (!splash || splash.classList.contains('is-done')) return;
        if (window.__bootFailed) return; // main.js уже показал ошибку сам
        var ru = (navigator.language || 'ru').toLowerCase().indexOf('ru') === 0;
        var bar = document.getElementById('boot-splash__bar');
        if (bar) bar.parentNode.removeChild(bar);
        var title = document.getElementById('boot-splash__title');
        if (title) title.textContent = ru ? 'Не удалось загрузить игру' : 'Failed to load the game';
        var retry = document.createElement('button');
        retry.type = 'button';
        retry.className = 'boot-splash__retry';
        retry.textContent = ru ? 'Перезагрузить' : 'Reload';
        retry.onclick = function () { location.reload(); };
        splash.appendChild(retry);
      }, LIMIT_MS);
    })();
  </script>
