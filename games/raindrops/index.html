<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Русское название: main.ts перезапишет document.title по языку игрока
         (п. 5.1.3 — на каждом языке совпадает с одноимённой вкладкой карточки).
         До первого кадра англичанин и турок видят русскую строку — держим её,
         а не нейтральную заглушку: ru основной рынок, а пустой title браузер
         заменяет на URL, что хуже во всех трёх случаях. -->
    <title>Капли: Слияние 2048</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        /* skyBottom из src/render/palette.ts: поля десктопной колонки
           сливаются с низом градиента неба (ASSETS §«Экспорт в код»). */
        background: #304a64;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        /* П. 1.10.2: одного overflow: hidden мало — Chrome на Android всё
           равно тянет страницу вниз и перезагружает её свайпом. */
        overscroll-behavior: none;
        /* П. 1.6.1.8 и 1.6.2.7: лонгтап не должен ничего выделять. */
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        display: flex;
      }
      #game {
        display: block;
        margin: auto;
        /* П. 1.6.1.8 и 1.6.2.7 — на самом канвасе, а не только на body:
           наследование user-select в канвас работает в chromium, но Firefox
           отдаёт auto, а WebKit знает свойство только под префиксом. Без этих
           строк лонгтап выделял поле в Safari и Firefox (найдено прогоном
           playwright.crossbrowser.config.ts). */
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        /* Мобайл-первый портрет (PRD §2): на телефоне канвас занимает весь
           экран (п. 1.6.1.1 — 375×812 уже 0.46 по соотношению).
           На десктопе канвас растянут на всё окно (п. 1.6.2.1: активное поле
           идёт к краю доступной области) — градиент неба заполняет экран,
           плоской заливки body по бокам не видно. Кап 200vh = соотношение
           ровно 2:1, потолок п. 1.6.2.2: на 21:9 канвас упирается в него.
           Банку это не растягивает — её держит высота (0.94h/1.5 ≈ 0.63h);
           лишняя ширина уходит в боковые поля, ряд эволюции прижат к банке
           (hud.ts layoutEvolutionRow). */
        width: min(100%, 200vh);
        height: 100%;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-AhyO0TCc.js"></script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <!--
      SDK Яндекс Игр сознательно НЕ подключён статически: его подгружает
      platform/yandex.ts и только вне локальной разработки (паттерн донора
      sort_game_ya). Локальная консоль не тонет в ошибках SDK без iframe.
    -->
  </body>
</html>
